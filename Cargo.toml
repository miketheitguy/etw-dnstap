# trim-paths (nightly) keeps absolute build-host paths, which name the user's
# profile directory, out of panic locations in the shipped binary.
cargo-features = ["trim-paths"]

[package]
name = "etw-dnstap"
version = "0.1.0"
edition = "2024"
description = "Capture Windows DNS Server ETW packets as dnstap Frame Streams"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-queue = "0.3"
crossbeam-channel = "0.5.15"
prost = "0.14"
# ring, not aws-lc-rs: aws-lc-rs needs CMake and NASM on Windows MSVC.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# AES-128-GCM for the spool records (src/spool/crypt.rs). Already in the tree through rustls.
ring = "0.17"
# Verifies receiver certificates with the Windows system store; end-entity revocation, soft-fail.
rustls-platform-verifier = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# Win32_System_Performance: the PerfLib V2 provider API (src/perfcounters.rs).
# Win32_Storage_FileSystem: GetDiskFreeSpaceExW (spool free space) and the reparse-point
# attribute constant; also the version-resource readers in tests/version_resource.rs
# (GetFileVersionInfoW, VerQueryValueW). Win32_Security_Authorization: GetNamedSecurityInfoW (spool folder owner).
# Both are used by src/spool/fsinfo.rs.
# Win32_System_Registry: the wrapped spool key under HKLM\SOFTWARE\ETW-DNSTapService\Protect (src/spool/key.rs).
# Win32_System_Memory: VirtualAlloc and VirtualLock for the page that holds the encrypted
# spool key and the scratch area for its key schedule; Win32_System_ErrorReporting:
# WerRegisterExcludedMemoryBlock keeps that page out of crash dumps (src/spool/locked.rs).
# Win32_System_Time looks unused to grep, but windows-sys gates OpenTraceW and
# EVENT_TRACE_LOGFILEW (src/etw/session.rs) behind it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Etw", "Win32_System_EventLog", "Win32_System_Time", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_ErrorReporting"] }

[features]
# Diagnostic only: times the parser thread idle parks and socket writes.
diag-timing = ["windows-sys/Win32_Media"]
# Fuzzing only: exposes `#[doc(hidden)] etw_dnstap::fuzzing` entry points used by
# the separate `fuzz/` crate. Never enable it in a shipped build.
fuzzing = []
# Benchmark only: exposes `#[doc(hidden)] etw_dnstap::bench` entry points used by
# `benches/hot_path.rs`. The records are built from the saved DNS Server template,
# which `src/etw/decode.rs` compiles in for this feature too. The process memory
# counters report the benchmark pool's private bytes. Never enable it in a
# shipped build.
bench = ["windows-sys/Win32_System_ProcessStatus"]

[build-dependencies]
# Compiles packaging/perfcounters/etw-dnstap-perf.rc (counter names) and the generated
# VERSIONINFO resource into the exe.
embed-resource = "3.0.12"

[dev-dependencies]
# Generates a throwaway CA and server certificate for the TLS transport tests.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Hot-path benchmark (`benches/hot_path.rs`). No rayon or plotters: the analysis
# runs single-threaded and reports text only, which keeps the dependency graph
# and its licenses small.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Built and run only with `cargo bench --locked --features bench`. Without the
# feature, `cargo bench` and `cargo clippy --all-targets` skip the target.
[[bench]]
name = "hot_path"
harness = false
required-features = ["bench"]

[profile.dev]
debug = 2

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
overflow-checks = true
panic = "abort"
# Whole-program optimization of the hot path (decode, encode, pool) across crates:
# 10% faster parse and encode, 7.7% smaller image, release builds about 50% slower
# (datasets/baselines/code-review-2026-11-01/README.md, Phase 2 results).
# scripts/ci/verify-pe.ps1 and scripts/ci/verify-link-exceptions.ps1 must pass
# after any change here: LTO changes the final link.
lto = "fat"
codegen-units = 1
trim-paths = "all"

[profile.asan]
inherits = "dev"
panic = "unwind"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
missing_const_for_fn = "warn"
shadow_unrelated = "warn"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
