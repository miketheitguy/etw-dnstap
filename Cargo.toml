[package]
name = "etw-dnstap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Capture Windows DNS Server ETW packets as dnstap Frame Streams"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-queue = "0.3"
crossbeam-channel = "0.5.15"
prost = "0.14"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Etw", "Win32_System_EventLog", "Win32_System_Time", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }

[features]
# Diagnostic only: times the parser thread idle parks and socket writes.
diag-timing = []
# Fuzzing only: exposes `#[doc(hidden)] etw_dnstap::fuzzing` entry points used by
# the separate `fuzz/` crate. Never enable it in a shipped build.
fuzzing = []

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.dev]
debug = 2
overflow-checks = true

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
overflow-checks = true
panic = "abort"

[profile.asan]
inherits = "dev"
panic = "unwind"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
