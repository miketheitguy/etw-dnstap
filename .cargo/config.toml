[build]
target = "x86_64-pc-windows-msvc"

# MSVC can generate PDBs even with debug = 0 and stripping enabled.
# Suppress linker debug output only in release builds; retain development/ASan PDBs.
[profile.release]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]

# Target flags apply to the service, Rust dependencies, and rebuilt standard
# library. The explicit build target keeps host build scripts and proc macros
# on their default compiler and linker settings.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "control-flow-guard=yes",
    "-C", "relocation-model=pic",
    "-Z", "stack-protector=all",
    "-Z", "ehcont-guard=yes",
    "-Z", "src-hash-algorithm=sha256",
    "-C", "link-arg=/MACHINE:X64",
    "-C", "link-arg=/DYNAMICBASE",
    "-C", "link-arg=/HIGHENTROPYVA",
    "-C", "link-arg=/NXCOMPAT",
    "-C", "link-arg=/GUARD:CF",
    "-C", "link-arg=/GUARD:EHCONT",
    # Hardening exception, approved 2026-11-01. ring (the rustls crypto
    # provider) ships its x86_64 assembly as prebuilt NASM objects without
    # EH-continuation metadata, so /GUARD:EHCONT alone rejects them (LNK2047).
    # This flag links anyway: the rest of the image keeps EHCONT metadata and
    # those routines never unwind (release builds abort on panic). The linker
    # still prints one LNK2047 line per object, which rustc forwards as a
    # "linker stdout" warning. (ring's C objects also draw LNK4291; the
    # linker generates conservative metadata for those, so they need no
    # exception.)
    #
    # Detector: scripts/ci/link-exceptions.txt lists the objects this
    # exception covers. CI captures the release build log and runs
    # scripts/ci/verify-link-exceptions.ps1, which fails when the LNK2047
    # set differs from that list in either direction. Add an object there
    # only after review. Remove this flag, and the list, when ring, or its
    # replacement, carries the metadata.
    #
    # Dependency decision: ring is kept as the crypto provider rather than
    # aws-lc-rs, which needs CMake and NASM on Windows MSVC. RUSTSEC-2025-0007
    # ("ring is unmaintained", issued 2025-02-21) was withdrawn after the
    # author gave the rustls team access; its last update (2025-03-06) says
    # the situation is "back to normal", not security-maintenance-only.
    "-C", "link-arg=/FORCE:GUARDEHCONT",
    "-C", "link-arg=/CETCOMPAT",
    "-C", "link-arg=/LARGEADDRESSAWARE",
]

[alias]
test-release = [
    "test", "--locked", "--release", "--config", 'profile.release.panic="unwind"',
]
# ASan is for testing. These arrays merge with the target settings above;
# build.rustflags would be ignored because target.rustflags takes precedence.
# rustdocflags also instrument documentation tests.
asan = [
    "test", "--locked", "--profile", "asan", "--target-dir", "target/asan",
    "--config", 'target.x86_64-pc-windows-msvc.rustflags=["-Z", "sanitizer=address"]',
    "--config", 'target.x86_64-pc-windows-msvc.rustdocflags=["-Z", "sanitizer=address"]',
]

# Equivalent to Cargo's -Z build-std=std,panic_unwind on every invocation.
# Rebuild the standard library with the target hardening flags and, during
# cargo asan, sanitizer instrumentation. Requires nightly Cargo and rust-src.
[unstable]
build-std = ["std", "panic_unwind"]
profile-rustflags = true
