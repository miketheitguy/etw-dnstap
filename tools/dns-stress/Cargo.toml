[package]
name = "dns-stress"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Bounded, pipelined UDP DNS laboratory load generator"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
overflow-checks = true
panic = "abort"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
