# Live tests that need real ETW and the DNS Server role.
#
# Runs only on a self-hosted Windows runner labelled `etw-lab` (a lab VM with the
# DNS Server role installed, and the runner service running as an administrator
# so it can start ETW sessions). There is no pull_request trigger on purpose: a
# fork must never be able to run code on the lab machine.
name: Lab (live ETW tests)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: lab
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  live-etw:
    name: cargo test -- --ignored
    runs-on: [self-hosted, windows, etw-lab]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      # The ignored tests start real ETW sessions with fixed names, so run them
      # one at a time.
      - name: Run ignored tests
        run: cargo test --locked -- --ignored --test-threads=1
